name: Build AE Compressor VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  windows:
    runs-on: windows-2022

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure Release build
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target AECompressor_VST3 -j 2

      - name: Locate built plugin
        shell: powershell
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" |
                    Select-Object -First 1

          if (-not $plugin) {
            Write-Host "Build contents:"
            Get-ChildItem -Path build -Recurse
            throw "VST3 plugin was not found."
          }

          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item $plugin.FullName -Destination artifact -Recurse -Force

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: AE-Compressor-vst3-windows
          path: artifact
