name: Build AE Compressor VST3

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure Release build
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        shell: pwsh
        run: cmake --build build --target AECompressor_VST3 --config Release --parallel 2

      - name: Locate built plugin
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "AE Compressor.vst3" | Select-Object -First 1
          if (-not $plugin) {
            Write-Host "AE Compressor.vst3 was not found. Build tree:"
            Get-ChildItem -Path build -Recurse | Select-Object FullName
            exit 1
          }
          Write-Host "Found plugin at: $($plugin.FullName)"
          "PLUGIN_PATH=$($plugin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: AE-Compressor-vst3-windows
          path: ${{ env.PLUGIN_PATH }}
          if-no-files-found: error
