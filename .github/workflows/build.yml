name: Build AE Compressor VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure Release build
        run: cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build

      - name: Locate build plugin
        shell: powershell
        run: |
          Get-ChildItem -Path build -Recurse -Filter *.vst3
          $plugin = Get-ChildItem -Path build -Recurse -Filter *.vst3 | Select-Object -First 1
          if (-not $plugin) {
            throw "VST3 plugin was not found."
          }
          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item $plugin.FullName -Destination artifact -Recurse -Force

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: AE-Compressor-vst3-windows
          path: artifact
